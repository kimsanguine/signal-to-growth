[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-to-growth"
version = "0.4.3"
description = "Evidence-driven skills that turn customer signals into measurable growth."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Sanggeun Kim" }
]
keywords = [
  "agent-skills",
  "customer-research",
  "product-growth",
  "saas"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12"
]
dependencies = [
  "jsonschema>=4.23,<5"
]

[project.optional-dependencies]
dev = [
  "ruff>=0.16,<0.17"
]
# Optional third-party citability scorer for `audit-answer-visibility`. The
# audit runs without it and reports `unknown` instead of a score, so this stays
# out of the base dependencies — see `src/signal_growth/geo_visibility.py`.
geo = [
  "geo-optimizer-skill>=4.15,<5"
]

[project.urls]
Homepage = "https://github.com/kimsanguine/signal-to-growth"
Repository = "https://github.com/kimsanguine/signal-to-growth"
Issues = "https://github.com/kimsanguine/signal-to-growth/issues"

[project.scripts]
signal-to-growth = "signal_growth.cli:main"

[tool.ruff]
target-version = "py311"
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
# Pinned explicitly rather than relying on ruff's defaults, so upgrading ruff
# cannot turn a green CI red on rules nobody chose. This set is the safety net
# the workflow was missing: undefined names, unused imports, and syntax or
# statement errors. Style-only rules stay out to keep the gate meaningful.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Tests bootstrap `src` onto sys.path before importing the package, so their
# imports are deliberately not at the top of the file.
"tests/*" = ["E402"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
