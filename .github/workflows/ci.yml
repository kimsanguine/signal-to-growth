name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Validate repository
        run: signal-to-growth validate-repo .

      - name: Validate public dummy artifacts
        run: signal-to-growth demo .

      - name: Run tests
        run: python -m unittest discover -s tests -v

      # ERE has no backslash-escaped backslash here: '\\[' matched a literal
      # backslash followed by any of T,O,D,... so no real placeholder ever
      # matched and the guard silently passed. '\[' escapes the bracket.
      - name: Verify no unresolved placeholders
        run: |
          if grep -R -n -E '\[(TODO|PLACEHOLDER)[^]]*\]' \
            --exclude-dir=.git --exclude-dir=.venv .; then
            exit 1
          fi
